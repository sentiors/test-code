<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Scheme - GradingCTL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
body {
    font-family: 'Inter', sans-serif;
    transition: all 0.3s ease;
}

#sidebar {
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                padding 0.3s;
}

#main-content {
    transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ========================= */
/* SIDEBAR COLLAPSED */
/* ========================= */
.sidebar-collapsed {
    width: 80px !important;
    padding-left: 0.75rem !important;
    padding-right: 0.75rem !important;
}

/* sembunyiin teks */
.sidebar-collapsed .nav-text,
.sidebar-collapsed .sidebar-header-text,
.sidebar-collapsed .admin-text {
    display: none !important;
}

/* nav item tetap horizontal */
.sidebar-collapsed .nav-item {
    justify-content: flex-start !important;
    padding-left: 1rem !important;
    padding-right: 1rem !important;
}

/* margin icon tetap rapi */
.sidebar-collapsed .nav-item i {
    margin-right: 0 !important;
}

/* header (☰) biar nggak aneh */
.sidebar-collapsed .px-3.py-4 {
    justify-content: center;
}

/* admin avatar */
.sidebar-collapsed .admin-container {
    justify-content: center;
}

/* ========================= */
/* ACTIVE INDICATOR */
/* ========================= */
.sidebar-active-indicator {
    position: absolute;
    left: 0;
    width: 4px;
    height: 20px;
    background-color: white;
    border-radius: 0 4px 4px 0;
}

/* ❌ HILANG SAAT COLLAPSE */
.sidebar-collapsed .sidebar-active-indicator {
    display: none !important;
}

        .premium-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12), 0 12px 20px -5px rgba(0, 0, 0, 0.08);
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 overflow-x-hidden">

    <aside id="sidebar" class="fixed left-3 top-3 bottom-3 w-64 bg-black rounded-[1.5rem] flex flex-col p-4 text-white shadow-xl z-50 overflow-hidden">
        <div class="px-3 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-tight sidebar-header-text">GradingCTL</h1>
            <button onclick="toggleSidebar()" class="p-2 hover:bg-gray-800 rounded-lg transition-colors flex items-center justify-center">
                <i data-lucide="menu" class="w-5 h-5 text-white"></i>
            </button>
        </div>

        <div class="w-full h-[1px] bg-gray-800 mb-6"></div>

        <div class="px-3 mb-6 flex items-center gap-3 admin-container">
            <div class="w-10 h-10 rounded-full bg-gray-700 flex flex-shrink-0 items-center justify-center">
                <i data-lucide="user" class="w-5 h-5 text-gray-300"></i>
            </div>
            <span class="font-medium text-base admin-text">Admin</span>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar">
            <nav class="space-y-1">
                <a href="/" class="nav-item group flex items-center px-3 py-2.5 text-gray-400 hover:text-white hover:bg-gray-900 rounded-xl transition-all">
                    <i data-lucide="layout-dashboard" class="mr-3 w-5 h-5 flex-shrink-0"></i>
                    <span class="text-sm nav-text">Dashboard</span>
                </a>
                <a href="/schemes" class="nav-item group flex items-center px-3 py-2.5 text-white relative bg-gray-900 rounded-xl transition-all">
                    <div class="sidebar-active-indicator"></div>
                    <i data-lucide="list" class="mr-3 w-5 h-5 flex-shrink-0"></i>
                    <span class="text-sm nav-text">Scheme List</span>
                </a>
                <a href="/results" class="nav-item group flex items-center px-3 py-2.5 text-gray-400 hover:text-white hover:bg-gray-900 rounded-xl transition-all">
                    <i data-lucide="file-text" class="mr-3 w-5 h-5 flex-shrink-0"></i>
                    <span class="text-sm nav-text">Grading Result</span>
                </a>
                <a href="/admin" class="nav-item group flex items-center px-3 py-2.5 text-gray-400 hover:text-white hover:bg-gray-900 rounded-xl transition-all">
                    <i data-lucide="settings" class="mr-3 w-5 h-5 flex-shrink-0"></i>
                    <span class="text-sm nav-text">Management</span>
                </a>
            </nav>

            <div class="px-3 my-4"><div class="w-full h-[1px] bg-gray-800"></div></div>

            <a href="/logout" class="nav-item group flex items-center px-3 py-2.5 text-gray-400 hover:text-red-400 hover:bg-gray-900 rounded-xl transition-all">
                <i data-lucide="log-out" class="mr-3 w-5 h-5 flex-shrink-0"></i>
                <span class="text-sm nav-text">Log Out</span>
            </a>
        </div>
    </aside>

    <main id="main-content" class="ml-64 p-8 min-h-screen flex justify-center">
        <div class="max-w-5xl w-full">
            <header class="mb-6">
                <div class="flex items-center gap-4 mb-2">
                    <a href="/" class="p-2.5 bg-white rounded-xl shadow-sm border border-gray-100 text-gray-500 hover:text-black transition-all">
                        <i data-lucide="arrow-left" class="w-6 h-6"></i>
                    </a>
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Edit Scheme</h1>
                        <p class="text-gray-500 text-base">Modify criteria for <span class="text-blue-600 font-semibold">{{ scheme.lab_id }}</span></p>
                    </div>
                </div>
                <div class="w-full h-1 bg-gray-200 mt-4 rounded-full"></div>
            </header>

            <form id="editForm">
                <div class="bg-white rounded-[2rem] premium-shadow border border-gray-100 p-8 mb-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-widest ml-1">Lab ID</label>
                            <input type="text" class="w-full bg-gray-50 border border-gray-200 rounded-2xl px-5 py-4 text-gray-600 font-semibold outline-none cursor-not-allowed" value="{{ scheme.lab_id }}" disabled>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-gray-400 uppercase tracking-widest ml-1">Grading Type</label>
                            <select id="grading_type" class="w-full bg-white border border-gray-200 rounded-2xl px-5 py-4 text-gray-800 font-bold outline-none focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 transition-all cursor-pointer text-base">
                                <option value="kelompok" {% if scheme.grading_type == 'kelompok' %}selected{% endif %}>Kelompok</option>
                                <option value="individu" {% if scheme.grading_type == 'individu' %}selected{% endif %}>Individu</option>
                                <option value="individu_per_kelompok" {% if scheme.grading_type == 'individu_per_kelompok' %}selected{% endif %}>Individu per Kelompok</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="bg-white rounded-[2rem] premium-shadow border border-gray-100 overflow-hidden">
                    <div class="p-6 border-b border-gray-50 flex justify-between items-center bg-gray-50/50">
                        <h3 class="font-bold text-lg text-gray-800">Criteria List</h3>
<button type="button" onclick="addCriterion()" class="bg-black text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-gray-800 transition-all flex items-center gap-2 shadow-md">
    <i data-lucide="plus" class="w-4 h-4"></i> Add New Criterion
</button>
                    </div>

                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b border-gray-100 text-[11px] font-bold text-gray-400 uppercase tracking-widest">
                                    <th class="px-6 py-5 text-center">Clear</th>
                                    <th class="px-6 py-5">Type</th>
                                    <th class="px-6 py-5">Key / Variable</th>
                                    <th class="px-6 py-5">Expected</th>
                                    <th class="px-6 py-5">Description</th>
                                    <th class="px-6 py-5">Score</th>
                                    <th class="px-6 py-5 text-center">Action</th>
                                </tr>
                            </thead>
                            <tbody id="criteria-container" class="divide-y divide-gray-50">
                                {% for criterion in scheme.criteria %}
                                <tr class="criterion-row hover:bg-gray-50/30 transition-colors">
                                    <td class="px-4 py-6 text-center">
                                        <input type="checkbox" name="cleanup" {% if criterion.cleanup %}checked{% endif %} class="w-5 h-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    </td>
                                    <td class="px-4 py-6 min-w-[140px]">
                                        <select name="type" required onchange="updateExpected(this)" class="bg-white border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-semibold outline-none focus:border-blue-500 w-full shadow-sm">
                                            {% for type in types %}
                                                <option value="{{ type }}" {% if type == criterion.type %}selected{% endif %}>{{ type }}</option>
                                            {% endfor %}
                                        </select>
                                    </td>
                                    <td class="px-4 py-6">
                                        <input type="text" name="key" value="{{ criterion.key }}" required class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium outline-none focus:border-blue-500 shadow-sm">
                                    </td>
                                    <td class="px-4 py-6 min-w-[140px]">
                                        <select name="expected" required class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2.5 text-sm font-semibold outline-none focus:border-blue-500 shadow-sm">
                                            {% for exp in expected[criterion.type] %}
                                                <option value="{{ exp }}" {% if exp == criterion.expected %}selected{% endif %}>{{ exp }}</option>
                                            {% endfor %}
                                        </select>
                                    </td>
                                    <td class="px-4 py-6">
                                        <input type="text" name="description" value="{{ criterion.description }}" required class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-medium outline-none focus:border-blue-500 shadow-sm">
                                    </td>
                                    <td class="px-4 py-6">
                                        <input type="number" step="0.1" name="score" value="{{ criterion.score }}" required class="w-24 bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm font-bold outline-none focus:border-blue-500 shadow-sm">
                                    </td>
                                    <td class="px-4 py-6 text-center">
                                        <button type="button" onclick="removeRow(this)" class="p-2.5 text-red-500 hover:bg-red-50 rounded-xl transition-all">
                                            <i data-lucide="trash-2" class="w-5 h-5"></i>
                                        </button>
                                    </td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>

<div class="mt-8 mb-12 flex justify-end">
    <button type="submit" class="bg-blue-600 text-white px-8 py-3 rounded-xl text-sm font-bold hover:bg-blue-700 transition-all shadow-lg shadow-blue-200 flex items-center gap-2 tracking-wide uppercase">
        <i data-lucide="save" class="w-5 h-5"></i>
        Save Changes
    </button>
</div>
            </form>
        </div>
    </main>

<div id="customModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 overflow-x-hidden overflow-y-auto bg-black/60 backdrop-blur-sm">
    <div class="relative bg-white rounded-[2rem] p-5 w-full max-w-[320px] shadow-2xl modal-enter border border-gray-100 text-center">
        <div id="modalIconBg" class="w-10 h-10 rounded-xl flex items-center justify-center mx-auto mb-3">
            <i id="modalIcon" data-lucide="alert-circle" class="w-5 h-5"></i>
        </div>

        <h3 id="modalTitle" class="text-lg font-bold text-gray-900 leading-tight mb-1">Notice</h3>
        <p id="modalMessage" class="text-[11px] text-gray-500 mb-5 leading-relaxed"></p>

        <div id="modalFooter" class="flex gap-2"></div>
    </div>
</div>

<style>
    .modal-enter { animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    @keyframes modalIn {
        from { opacity: 0; transform: scale(0.9) translateY(20px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }
</style>

<script>
        lucide.createIcons();
        const expectedOptions = { {% for type in types %} "{{ type }}": {{ expected[type] | tojson }},{% endfor %} };

        // --- SISTEM MODAL CUSTOM ---
        const modal = {
            el: document.getElementById('customModal'),
            iconBg: document.getElementById('modalIconBg'),
            icon: document.getElementById('modalIcon'),
            title: document.getElementById('modalTitle'),
            msg: document.getElementById('modalMessage'),
            footer: document.getElementById('modalFooter'),

            show({ type = 'info', title, message, onConfirm = null, showCancel = false }) {
                this.el.classList.remove('hidden');
                this.title.innerText = title;
                this.msg.innerText = message;
                this.footer.innerHTML = '';

                if (type === 'warning') {
                    this.iconBg.className = "w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center mx-auto mb-3";
                    this.icon.className = "w-5 h-5 text-amber-600";
                    this.icon.setAttribute('data-lucide', 'alert-triangle');
                } else if (type === 'success') {
                    this.iconBg.className = "w-10 h-10 rounded-full bg-green-50 flex items-center justify-center mx-auto mb-3";
                    this.icon.className = "w-5 h-5 text-green-600";
                    this.icon.setAttribute('data-lucide', 'check-circle');
                } else if (type === 'error') {
                    this.iconBg.className = "w-10 h-10 rounded-full bg-red-50 flex items-center justify-center mx-auto mb-3";
                    this.icon.className = "w-5 h-5 text-red-600";
                    this.icon.setAttribute('data-lucide', 'x-circle');
                }

                lucide.createIcons();

                if (showCancel) {
                    const btnCancel = document.createElement('button');
                    btnCancel.className = "flex-1 py-2.5 bg-gray-100 text-gray-600 rounded-xl text-xs font-bold hover:bg-gray-200 transition-all";
                    btnCancel.innerText = 'Cancel';
                    btnCancel.onclick = () => this.hide();
                    this.footer.appendChild(btnCancel);
                }

                const btnOk = document.createElement('button');
                btnOk.className = "flex-1 py-2.5 bg-blue-600 text-white rounded-xl text-xs font-bold hover:bg-blue-700 shadow-lg shadow-blue-200 transition-all";
                btnOk.innerText = onConfirm ? 'Continue' : 'Understand';
                btnOk.onclick = () => {
                    this.hide();
                    if (onConfirm) onConfirm();
                };
                this.footer.appendChild(btnOk);
            },

            hide() {
                this.el.classList.add('hidden');
            }
        };

        // --- LOGIC FORM ---
        document.getElementById('editForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const criteria = [];
            let totalScore = 0;

            document.querySelectorAll('.criterion-row').forEach(row => {
                const s = parseFloat(row.querySelector('input[name="score"]').value) || 0;
                totalScore += s;
                criteria.push({
                    type: row.querySelector('select[name="type"]').value,
                    key: row.querySelector('input[name="key"]').value,
                    expected: row.querySelector('select[name="expected"]').value,
                    description: row.querySelector('input[name="description"]').value,
                    score: s,
                    cleanup: row.querySelector('input[name="cleanup"]').checked
                });
            });

            const submitUpdate = () => {
                fetch('/edit_scheme/{{ scheme.lab_id }}', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        grading_type: document.getElementById('grading_type').value,
                        criteria: criteria
                    })
                })
                .then(r => r.json())
                .then(res => {
                    if(res.error) {
                        modal.show({ type: 'error', title: 'Update Failed', message: res.error });
                    } else {
                        modal.show({
                            type: 'success',
                            title: 'Scheme Updated!',
                            message: 'The grading scheme has been successfully updated.',
                            onConfirm: () => window.location.href = '/'
                        });
                    }
                })
                .catch(err => modal.show({ type: 'error', title: 'Network Error', message: 'Failed to connect to server.' }));
            };

            // Validasi skor sebelum submit
            if(totalScore !== 100) {
                modal.show({
                    type: 'warning',
                    title: 'Score Warning',
                    message: `Total score is ${totalScore}, not 100. Save changes anyway?`,
                    showCancel: true,
                    onConfirm: submitUpdate
                });
            } else {
                submitUpdate();
            }
        });

        // --- HELPER FUNCTIONS ---
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            sidebar.classList.toggle('sidebar-collapsed');
            mainContent.style.marginLeft = sidebar.classList.contains('sidebar-collapsed') ? "85px" : "256px";
        }

        function updateExpected(select) {
            const selectedType = select.value;
            const expectedSelect = select.closest('tr').querySelector('select[name="expected"]');
            expectedSelect.innerHTML = '';
            if (expectedOptions[selectedType]) {
                expectedOptions[selectedType].forEach(exp => {
                    const opt = document.createElement('option');
                    opt.value = exp; opt.textContent = exp;
                    expectedSelect.appendChild(opt);
                });
            }
        }

        function addCriterion() {
            const container = document.getElementById('criteria-container');
            const rows = container.querySelectorAll('.criterion-row');
            if (rows.length === 0) return;
            const newRow = rows[0].cloneNode(true);
            newRow.querySelectorAll('input').forEach(input => {
                if(input.type !== 'checkbox') input.value = '';
                else input.checked = false;
            });
            container.appendChild(newRow);
            lucide.createIcons();
        }

        function removeRow(button) {
            if (document.querySelectorAll('.criterion-row').length > 1) {
                button.closest('tr').remove();
            } else {
                modal.show({ type: 'error', title: 'Denied', message: "At least one criterion is required." });
            }
        }
    </script>

</body>
</html>
