<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - GradingCTL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        #sidebar {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s;
        }

        #main-content {
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* SIDEBAR COLLAPSED */
        .sidebar-collapsed {
            width: 80px !important;
            padding-left: 0.75rem !important;
            padding-right: 0.75rem !important;
        }

        .sidebar-collapsed .nav-text,
        .sidebar-collapsed .sidebar-header-text,
        .sidebar-collapsed .admin-text {
            display: none !important;
        }

        .sidebar-collapsed .nav-item {
            justify-content: flex-start !important;
            padding-left: 1rem !important;
            padding-right: 1rem !important;
        }

        .sidebar-collapsed .nav-item i {
            margin-right: 0 !important;
        }

        .sidebar-collapsed .px-3.py-4 {
            justify-content: center;
        }

        .sidebar-collapsed .admin-container {
            justify-content: center;
        }

        /* ACTIVE INDICATOR */
        .sidebar-active-indicator {
            position: absolute;
            left: 0;
            width: 4px;
            height: 20px;
            background-color: white;
            border-radius: 0 4px 4px 0;
        }

        .sidebar-collapsed .sidebar-active-indicator {
            display: none !important;
        }

        .premium-shadow {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.12), 0 12px 20px -5px rgba(0, 0, 0, 0.08);
        }

        .custom-scrollbar::-webkit-scrollbar { 
            width: 4px; 
        }
        .custom-scrollbar::-webkit-scrollbar-thumb { 
            background: #333; 
            border-radius: 10px; 
        }

        /* FullCalendar Styling */
        .fc { 
            font-size: 0.65rem; 
            background: transparent; 
            border: none; 
        }
        .fc .fc-toolbar-title { 
            font-size: 0.75rem !important; 
            font-weight: 800; 
            color: #1f2937; 
            text-transform: uppercase; 
        }
        .fc .fc-button { 
            padding: 2px 6px !important; 
            font-size: 0.55rem !important; 
            background: white !important; 
            color: black !important; 
            border: 1px solid #eee !important; 
            border-radius: 6px !important; 
            font-weight: bold; 
        }
        .fc th { 
            border: none !important; 
            color: #9ca3af; 
            font-size: 0.55rem; 
            text-transform: uppercase; 
            padding: 4px 2px !important; 
        }
        .fc td { 
            border: 1px solid rgba(0,0,0,0.03) !important; 
        }
        .fc-daygrid-day-number { 
            color: #1f2937; 
            font-weight: 700; 
            text-decoration: none !important; 
            padding: 2px !important; 
            font-size: 0.7rem !important; 
        }

        .fc .fc-day-today { 
            background-color: rgba(0, 0, 0, 0.02) !important; 
        }
        .fc .fc-day-today .fc-daygrid-day-number {
            background: black !important;
            color: white !important;
            border-radius: 4px;
            padding: 2px 5px !important;
            margin: 2px;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 overflow-x-hidden">
    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed left-3 top-3 bottom-3 w-64 bg-black rounded-[1.5rem] flex flex-col p-4 text-white shadow-xl z-50 overflow-hidden custom-scrollbar">
        <div class="px-3 py-4 flex items-center justify-between">
            <h1 class="text-xl font-bold tracking-tight sidebar-header-text">GradingCTL</h1>
            <button onclick="toggleSidebar()" class="p-2 hover:bg-gray-800 rounded-lg transition-colors flex items-center justify-center" title="Toggle Sidebar">
                <i data-lucide="menu" class="w-5 h-5 text-white"></i>
            </button>
        </div>

        <div class="w-full h-[1px] bg-gray-800 mb-6"></div>

        <div class="px-3 mb-6 flex items-center gap-3 admin-container">
            <div class="w-10 h-10 rounded-full bg-gray-700 flex flex-shrink-0 items-center justify-center">
                <i data-lucide="user" class="w-5 h-5 text-gray-300"></i>
            </div>
            <span class="font-medium text-base admin-text">Admin</span>
        </div>

        <div class="flex-1 overflow-y-auto">
            <nav class="space-y-1">
                <!-- Active Dashboard -->
                <a href="/" class="nav-item group flex items-center px-3 py-2.5 text-white relative bg-gray-900 rounded-xl transition-all">
                    <div class="sidebar-active-indicator"></div>
                    <i data-lucide="layout-dashboard" class="mr-3 w-5 h-5 flex-shrink-0"></i>
                    <span class="text-sm nav-text">Dashboard</span>
                </a>
                <a href="/schemes" class="nav-item group flex items-center px-3 py-2.5 text-gray-400 hover:text-white hover:bg-gray-900 rounded-xl transition-all">
                    <i data-lucide="list" class="mr-3 w-5 h-5 flex-shrink-0"></i>
                    <span class="text-sm nav-text">Scheme List</span>
                </a>
                <a href="/results" class="nav-item group flex items-center px-3 py-2.5 text-gray-400 hover:text-white hover:bg-gray-900 rounded-xl transition-all">
                    <i data-lucide="file-text" class="mr-3 w-5 h-5 flex-shrink-0"></i>
                    <span class="text-sm nav-text">Grading Result</span>
                </a>
                <a href="/admin" class="nav-item group flex items-center px-3 py-2.5 text-gray-400 hover:text-white hover:bg-gray-900 rounded-xl transition-all">
                    <i data-lucide="settings" class="mr-3 w-5 h-5 flex-shrink-0"></i>
                    <span class="text-sm nav-text">Management</span>
                </a>
            </nav>

            <div class="px-3 my-4">
                <div class="w-full h-[1px] bg-gray-800"></div>
            </div>

            <a href="/logout" class="nav-item group flex items-center px-3 py-2.5 text-gray-400 hover:text-red-400 hover:bg-gray-900 rounded-xl transition-all">
                <i data-lucide="log-out" class="mr-3 w-5 h-5 flex-shrink-0"></i>
                <span class="text-sm nav-text">Log Out</span>
            </a>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main id="main-content" class="ml-64 p-8 min-h-screen flex justify-center">
        <div class="max-w-5xl w-full">
            <!-- HEADER -->
            <header class="mb-8">
                <div class="flex justify-between items-end">
                    <div>
                        <h1 class="text-3xl font-bold text-gray-900 tracking-tight">System Statistics</h1>
                        <p class="text-gray-500 mt-1">Overview for Class Management</p>
                    </div>
                </div>
                <div class="w-full h-1 bg-gray-200 mt-6 rounded-full"></div>
            </header>

            <!-- STATS GRID -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-stretch">
                <!-- LEFT STAT CARDS -->
                <div class="lg:col-span-3 space-y-4">
                    <a href="/admin" class="block">
                        <div class="bg-[#F9E886] rounded-[2rem] p-6 flex-1 flex flex-col justify-between premium-shadow border border-white/50 hover:scale-[1.02] transition-all cursor-pointer">
                            <span class="text-[10px] font-bold text-gray-700 uppercase tracking-widest">Total Users</span>
                            <div class="flex justify-end items-baseline gap-1 mt-2">
                                <span class="text-5xl font-black text-gray-900 tracking-tighter">{{ total_users }}</span>
                            </div>
                        </div>
                    </a>
                    <a href="/" class="block">
                        <div class="bg-[#E9B1D1] rounded-[2rem] p-6 flex-1 flex flex-col justify-between premium-shadow border border-white/50 hover:scale-[1.02] transition-all cursor-pointer">
                            <span class="text-[10px] font-bold text-gray-700 uppercase tracking-widest">Total Labs</span>
                            <div class="flex justify-end items-baseline gap-1 mt-2">
                                <span class="text-5xl font-black text-gray-900 tracking-tighter">{{ total_labs }}</span>
                            </div>
                        </div>
                    </a>
                </div>

                <!-- CLASS PROGRESS -->
                <div class="lg:col-span-5 bg-white border border-gray-100 rounded-[2rem] p-6 premium-shadow">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-bold text-gray-800 uppercase text-[10px] tracking-widest">Class Progress</h3>
                        <select onchange="filterByClass(this.value)" class="text-[10px] font-bold bg-gray-50 border border-gray-200 rounded-xl px-3 py-2 outline-none cursor-pointer hover:bg-gray-100 transition-all">
                            <option value="">SELECT CLASS</option>
                            {% if classes %}
                                {% for c in classes %}
                                <option value="{{ c.class_name }}">{{ c.class_name }}</option>
                                {% endfor %}
                            {% endif %}
                        </select>
                    </div>

                    <div class="flex-1 flex items-center justify-between px-2 h-[280px]">
                        <div class="relative w-44 h-44 flex items-center justify-center">
                            <svg class="w-full h-full transform -rotate-90">
                                <circle cx="88" cy="88" r="76" stroke="currentColor" stroke-width="12" fill="transparent" class="text-gray-100" />
                                <circle id="progress-circle" cx="88" cy="88" r="76" stroke="currentColor" stroke-width="12" fill="transparent" stroke-dasharray="477" stroke-dashoffset="477" stroke-linecap="round" class="text-black transition-all duration-700" />
                            </svg>
                            <span id="progress-text" class="absolute text-4xl font-black tracking-tighter">--%</span>
                        </div>

                        <div class="flex flex-col gap-4 ml-6">
                            <div class="bg-gray-50 px-5 py-4 rounded-2xl border border-gray-100 shadow-sm">
                                <p class="text-[9px] text-gray-400 font-bold uppercase mb-1">Status</p>
                                <p class="text-lg font-black text-gray-900 leading-none" id="status-text">Standby</p>
                            </div>
                            <div class="px-2">
                                <p id="class-label" class="text-[11px] font-extrabold text-gray-500 uppercase leading-tight max-w-[130px]">
                                    Select class to view details
                                </p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SCHEDULES -->
                <div class="lg:col-span-4 bg-[#A4C4FF] rounded-[2rem] p-6 flex flex-col premium-shadow border border-white/20">
                    <div class="flex justify-between items-center mb-4 text-gray-800">
                        <h3 class="text-[10px] font-bold uppercase tracking-widest">Schedules</h3>
                        <i data-lucide="calendar" class="w-4 h-4"></i>
                    </div>
                    <div id="calendar" class="flex-1 bg-white/60 backdrop-blur-md rounded-2xl p-3 min-h-[220px]"></div>
                </div>
            </div>

            <!-- MONITORING STATUS -->
            <div class="mt-12 p-6 border-2 border-dashed border-gray-200 rounded-[2rem] flex items-center justify-center gap-3 text-gray-400 bg-white/30 backdrop-blur-sm">
                <i data-lucide="zap" class="w-4 h-4 text-yellow-400"></i>
                <p class="text-[10px] font-bold uppercase tracking-[0.2em]">System Monitoring Engine Active</p>
            </div>
        </div>
    </main>

    <!-- JAVASCRIPT -->
    <script>
        // Global data
        window.classProgressData = {{ class_progress | tojson | safe }};

        // Initialize icons on load
        lucide.createIcons();

        // Filter class progress
        function filterByClass(className) {
            const circle = document.getElementById('progress-circle');
            const text = document.getElementById('progress-text');
            const label = document.getElementById('class-label');
            const statusText = document.getElementById('status-text');
            const maxDash = 477;

            if (className === "" || !window.classProgressData[className]) {
                text.innerText = "--%";
                circle.style.strokeDashoffset = maxDash;
                label.innerText = "Select class to view details";
                statusText.innerText = "Standby";
            } else {
                const progress = window.classProgressData[className];
                const percent = progress.percent;
                const offset = maxDash - (maxDash * percent / 100);
                
                circle.style.strokeDashoffset = offset;
                text.innerText = percent + "%";
                label.innerText = `${className}: ${progress.completed}/${progress.total} Labs`;
                statusText.innerText = "Monitoring";
            }
        }

        // Initialize calendar
        document.addEventListener('DOMContentLoaded', function() {
            const calendarEl = document.getElementById('calendar');
            const calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                headerToolbar: { 
                    left: 'title', 
                    center: '', 
                    right: 'prev,next' 
                },
                height: 'auto',
                nowIndicator: true,
            });
            calendar.render();
        });

        // Toggle sidebar
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('main-content');
            
            sidebar.classList.toggle('sidebar-collapsed');
            mainContent.style.marginLeft = sidebar.classList.contains('sidebar-collapsed') ? "85px" : "256px";
        }
    </script>
</body>
</html>
