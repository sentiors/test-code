<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - GradingCTL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; }
        .login-card { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08); border: 1px solid rgba(255, 255, 255, 0.7); }
        .modal-enter { animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-[400px] relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-gray-900 tracking-tighter uppercase">Reset Password</h1>
            <p class="text-sm text-gray-400 font-medium">Verification via Secure OTP</p>
        </div>

        <div class="bg-white/80 backdrop-blur-xl login-card rounded-[2.5rem] p-8">
            <div id="step1" class="space-y-5">
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Username</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                            <input type="text" id="username" 
                                class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3.5 pl-11 pr-4 text-sm outline-none focus:ring-2 focus:ring-black/5 focus:bg-white transition-all" 
                                placeholder="Your admin ID">
                        </div>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Email Address</label>
                        <div class="relative">
                            <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                            <input type="email" id="email" 
                                class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3.5 pl-11 pr-4 text-sm outline-none focus:ring-2 focus:ring-black/5 focus:bg-white transition-all" 
                                placeholder="name@example.com">
                        </div>
                    </div>
                    <button onclick="requestOTP()" id="btnRequest" 
                        class="w-full bg-black text-white rounded-2xl py-4 text-sm font-bold shadow-lg shadow-black/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        Send OTP Code <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>

            <div id="step2" class="hidden space-y-5">
                <div class="bg-gray-100 text-gray-500 p-3 rounded-2xl text-[10px] font-bold text-center uppercase tracking-widest border border-gray-200/50">
                    OTP Sent! Check your email.
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">OTP Code</label>
                    <div class="relative">
                        <i data-lucide="key-round" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                        <input type="text" id="otp_code" 
                            class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3.5 pl-11 pr-4 text-sm font-black tracking-[0.3em] outline-none focus:ring-2 focus:ring-black/5 transition-all" 
                            placeholder="000000">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">New Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                        <input type="password" id="new_password" 
                            class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3.5 pl-11 pr-4 text-sm outline-none focus:ring-2 focus:ring-black/5 transition-all" 
                            placeholder="••••••••">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Confirm Password</label>
                    <div class="relative">
                        <i data-lucide="shield-check" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                        <input type="password" id="confirm_password" 
                            class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3.5 pl-11 pr-4 text-sm outline-none focus:ring-2 focus:ring-black/5 transition-all" 
                            placeholder="••••••••">
                    </div>
                </div>
                <button onclick="resetPassword()" 
                    class="w-full bg-black text-white rounded-2xl py-4 text-sm font-bold shadow-lg shadow-black/20 hover:scale-[1.02] active:scale-[0.98] transition-all">
                    Reset & Login
                </button>
            </div>

            <div class="text-center pt-6">
                <a href="{{ url_for('login_web') }}" 
                    class="text-[10px] font-bold text-gray-400 hover:text-black uppercase tracking-widest transition-colors flex items-center justify-center gap-1">
                    <i data-lucide="arrow-left" class="w-3 h-3"></i> Back to Login
                </a>
            </div>
        </div>
    </div>

    <div id="customModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="relative bg-white rounded-[2.5rem] p-6 w-full max-w-[320px] shadow-2xl modal-enter border border-gray-100 text-center">
            <div id="modalIconBg" class="w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <i id="modalIcon" data-lucide="alert-circle" class="w-6 h-6"></i>
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-gray-900 mb-2 tracking-tight">Notice</h3>
            <p id="modalMessage" class="text-[12px] text-gray-500 mb-6 leading-relaxed px-2"></p>
            <div id="modalFooter"></div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        const modal = {
            el: document.getElementById('customModal'),
            iconBg: document.getElementById('modalIconBg'),
            icon: document.getElementById('modalIcon'),
            title: document.getElementById('modalTitle'),
            msg: document.getElementById('modalMessage'),
            footer: document.getElementById('modalFooter'),
            show({ type = 'info', title, message, onConfirm = null }) {
                this.el.classList.remove('hidden');
                this.title.innerText = title;
                this.msg.innerText = message;
                this.footer.innerHTML = '';
                if (type === 'error') {
                    this.iconBg.className = "w-12 h-12 rounded-2xl bg-red-50 flex items-center justify-center mx-auto mb-4";
                    this.icon.className = "w-6 h-6 text-red-600";
                    this.icon.setAttribute('data-lucide', 'x-circle');
                } else if (type === 'success') {
                    this.iconBg.className = "w-12 h-12 rounded-2xl bg-emerald-50 flex items-center justify-center mx-auto mb-4";
                    this.icon.className = "w-6 h-6 text-emerald-600";
                    this.icon.setAttribute('data-lucide', 'check-circle');
                } else if (type === 'warning') {
                    this.iconBg.className = "w-12 h-12 rounded-2xl bg-amber-50 flex items-center justify-center mx-auto mb-4";
                    this.icon.className = "w-6 h-6 text-amber-600";
                    this.icon.setAttribute('data-lucide', 'alert-triangle');
                }
                lucide.createIcons();
                const btnOk = document.createElement('button');
                btnOk.className = "w-full py-3.5 bg-black text-white rounded-2xl text-xs font-bold hover:scale-[1.02] active:scale-[0.98] transition-all";
                btnOk.innerText = 'Understand';
                btnOk.onclick = () => { this.hide(); if (onConfirm) onConfirm(); };
                this.footer.appendChild(btnOk);
            },
            hide() { this.el.classList.add('hidden'); }
        };

        async function requestOTP() {
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const btn = document.getElementById('btnRequest');

            if(!username || !email) {
                modal.show({ type: 'warning', title: 'Empty Fields', message: 'Please enter both username and email.' });
                return;
            }

            btn.disabled = true;
            btn.innerHTML = "Processing...";

            try {
                const res = await fetch('/request_reset_otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email })
                });
                const data = await res.json();
                if (res.ok) {
                    document.getElementById('step1').classList.add('hidden');
                    document.getElementById('step2').classList.remove('hidden');
                } else {
                    modal.show({ type: 'error', title: 'Request Failed', message: data.error });
                    btn.disabled = false;
                    btn.innerHTML = 'Send OTP Code <i data-lucide="send" class="w-4 h-4"></i>';
                    lucide.createIcons();
                }
            } catch (err) {
                modal.show({ type: 'error', title: 'Network Error', message: 'Failed to connect to server.' });
                btn.disabled = false;
                btn.innerHTML = 'Send OTP Code';
            }
        }

        async function resetPassword() {
            const username = document.getElementById('username').value;
            const otp = document.getElementById('otp_code').value;
            const new_password = document.getElementById('new_password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if(!otp || !new_password || !confirm_password) {
                modal.show({ type: 'warning', title: 'Notice', message: 'Please fill in all fields.' });
                return;
            }

            if(new_password !== confirm_password) {
                modal.show({ type: 'error', title: 'Mismatch', message: 'Passwords do not match. Please retype.' });
                return;
            }

            try {
                const res = await fetch('/reset_password_with_otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, otp, new_password })
                });
                const data = await res.json();
                if (res.ok) {
                    modal.show({ 
                        type: 'success', title: 'Success!', message: 'Password updated. You can now login.',
                        onConfirm: () => window.location.href = "{{ url_for('login_web') }}"
                    });
                } else {
                    modal.show({ type: 'error', title: 'Reset Failed', message: data.error });
                }
            } catch (err) {
                modal.show({ type: 'error', title: 'Network Error', message: 'Something went wrong.' });
            }
        }
    </script>
</body>
</html>
