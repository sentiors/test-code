<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - GradingCTL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f9fafb; }
        .reset-card {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="fixed top-20 right-20 w-64 h-64 bg-[#A4C4FF] rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-float"></div>
    <div class="fixed bottom-20 left-20 w-64 h-64 bg-[#F9E886] rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-float" style="animation-delay: 2s;"></div>

    <div class="w-full max-w-[400px] relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-gray-900 tracking-tighter">Set New Password</h1>
            <p class="text-sm text-gray-500 font-medium">Resetting password for <span class="text-black font-bold">@{{ username }}</span></p>
        </div>

        <div class="bg-white/80 backdrop-blur-xl reset-card rounded-[2.5rem] p-8">
            <form id="resetForm" class="space-y-5">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.15em] mb-2 ml-1">New Password</label>
                    <div class="relative">
                        <i data-lucide="lock" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                        <input type="password" id="password" name="password" required minlength="4"
                            class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3.5 pl-11 pr-4 text-sm outline-none focus:ring-2 focus:ring-black/5 focus:bg-white transition-all"
                            placeholder="••••••••">
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.15em] mb-2 ml-1">Confirm New Password</label>
                    <div class="relative">
                        <i data-lucide="shield-check" class="absolute left-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                        <input type="password" id="confirm_password" required minlength="4"
                            class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3.5 pl-11 pr-4 text-sm outline-none focus:ring-2 focus:ring-black/5 focus:bg-white transition-all"
                            placeholder="••••••••">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full bg-black text-white rounded-2xl py-4 text-sm font-bold shadow-lg shadow-black/20 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-2 group">
                        Update Password
                        <i data-lucide="check-circle" class="w-4 h-4 group-hover:scale-110 transition-transform"></i>
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center mt-8 text-[10px] font-bold text-gray-400 uppercase tracking-widest">
            &copy; 2025 GRADINGCTL
        </p>
    </div>

    <script>
        lucide.createIcons();

        const resetForm = document.getElementById('resetForm');
        
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (password !== confirmPassword) {
                alert("Password tidak cocok!");
                return;
            }

            try {
                // Mengirim ke route yang sama (POST)
                const response = await fetch(window.location.href, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({
                        'password': password
                    })
                });

                if (response.ok) {
                    const msg = await response.text();
                    // Menampilkan pesan sukses yang keren
                    document.body.innerHTML = `
                        <div class="text-center space-y-4">
                            <div class="bg-white p-10 rounded-[3rem] shadow-xl inline-block">
                                <i data-lucide="check-circle-2" class="w-16 h-16 text-green-500 mx-auto mb-4"></i>
                                <h1 class="text-2xl font-black">Success!</h1>
                                <p class="text-gray-500">Password has been updated.<br>You can close this tab and return to terminal.</p>
                            </div>
                        </div>
                    `;
                    lucide.createIcons();
                } else {
                    alert("Gagal merubah password. Link mungkin sudah expired.");
                }
            } catch (err) {
                console.error(err);
                alert("Terjadi kesalahan koneksi!");
            }
        });
    </script>
</body>
</html>
